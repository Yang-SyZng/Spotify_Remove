#!name=spotify-NoAD
#!desc = 用于 Spotify 客户端去广告和推广入口精简。
#!date = 2026.10.30-r7
#!author=🐇Gardenia.💙
#!url=https://raw.githubusercontent.com/Yang-SyZng/plugin-hub/main/ios/quantumult_x/spotify-NoAD.conf

hostname = spclient.wg.spotify.com, *-spclient.spotify.com
^https:\/\/(?:spclient\.wg|[\w-]+-spclient)\.spotify\.com(?::443)?\/(?:bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)(?:\?.*)?$ url script-request-header https://raw.githubusercontent.com/Yang-SyZng/plugin-hub/main/ios/js/spotify/spotify-NoAD.js
^https:\/\/(?:spclient\.wg|[\w-]+-spclient)\.spotify\.com(?::443)?\/(?:bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)(?:\?.*)?$ url script-response-body https://raw.githubusercontent.com/Yang-SyZng/plugin-hub/main/ios/js/spotify/spotify-NoAD.js
^https:\/\/(?:spclient\.wg|[\w-]+-spclient)\.spotify\.com(?::443)?\/(?:artistview\/v1\/artist|album-entity-view\/v2\/album)\/ url script-request-header https://raw.githubusercontent.com/Yang-SyZng/plugin-hub/main/ios/js/spotify/spotify-NoAD.js
^https:\/\/(?:spclient\.wg|[\w-]+-spclient)\.spotify\.com(?::443)?\/gabo-receiver-service(?:\/|\?|$) url script-echo-response https://raw.githubusercontent.com/Yang-SyZng/plugin-hub/main/ios/js/spotify/spotify-NoAD.js
